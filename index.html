/* Substitui, fora do Claude, os recursos que o artefato usava: banco de dados, download e anexos.
   Os dados ficam SOMENTE neste navegador (IndexedDB). Não são compartilhados com outros computadores. */
(function () {
  var DBN = 'rota-turismo', STORE = 'kv', cache = {}, subs = {}, ready;
  function idb() { return new Promise(function (ok, err) { var r = indexedDB.open(DBN, 1); r.onupgradeneeded = function () { r.result.createObjectStore(STORE); }; r.onsuccess = function () { ok(r.result); }; r.onerror = function () { err(r.error); }; }); }
  function kvGet(k) { return idb().then(function (d) { return new Promise(function (ok) { var q = d.transaction(STORE).objectStore(STORE).get(k); q.onsuccess = function () { ok(q.result); }; q.onerror = function () { ok(undefined); }; }); }); }
  function kvSet(k, v) { return idb().then(function (d) { return new Promise(function (ok) { var t = d.transaction(STORE, 'readwrite'); t.objectStore(STORE).put(v, k); t.oncomplete = ok; t.onerror = ok; }); }); }
  function load(c) { return cache[c] ? Promise.resolve(cache[c]) : kvGet('col:' + c).then(function (v) { return (cache[c] = v || {}); }); }
  function emit(c) { (subs[c] || []).forEach(function (f) { f(snapshot(c)); }); }
  function snapshot(c) { var m = cache[c] || {}; return { docs: Object.keys(m).map(function (id) { return { id: id, data: function () { return JSON.parse(JSON.stringify(m[id])); } }; }) }; }
  function save(c) { return kvSet('col:' + c, cache[c]).then(function () { emit(c); }); }
  var db = {
    collection: function (c) {
      return {
        onSnapshot: function (ok) { (subs[c] = subs[c] || []).push(ok); load(c).then(function () { ok(snapshot(c)); }); return function () { subs[c] = (subs[c] || []).filter(function (f) { return f !== ok; }); }; },
        doc: function (id) { return docRef(c, id); }
      };
    },
    doc: function (path) { var p = path.split('/'); return docRef(p[0], p.slice(1).join('/')); }
  };
  function docRef(c, id) {
    return {
      set: function (data) { return load(c).then(function () { cache[c][id] = JSON.parse(JSON.stringify(data)); return save(c); }); },
      update: function (data) { return load(c).then(function () { if (!cache[c][id]) throw new Error('Registro não encontrado'); Object.keys(data).forEach(function (k) { cache[c][id][k] = JSON.parse(JSON.stringify(data[k])); }); return save(c); }); },
      delete: function () { return load(c).then(function () { delete cache[c][id]; return save(c); }); },
      get: function () { return load(c).then(function () { var d = cache[c][id]; return { exists: !!d, id: id, data: function () { return d; } }; }); }
    };
  }
  var downloads = {
    save: function (o) {
      return new Promise(function (ok) {
        var blob = o.data instanceof Blob ? o.data : new Blob([o.data]), a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = o.filename; document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); ok(); }, 1000);
      });
    }
  };
  var assets = {
    upload: function (file) {
      return new Promise(function (ok, err) {
        var r = new FileReader(); r.onerror = function () { err(new Error('Falha ao ler o arquivo')); };
        r.onload = function () { var id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); kvSet('asset:' + id, r.result).then(function () { ok({ id: id, url: r.result, sizeBytes: file.size, contentType: file.type }); }); };
        r.readAsDataURL(file);
      });
    },
    delete: function (id) { return kvSet('asset:' + id, undefined); }
  };
  var caps = { db: db, downloads: downloads, assets: assets, mcp: null, sample: null };
  window.claude = { use: function (n) { return Promise.resolve(caps[n] === undefined ? null : caps[n]); } };
})();

/* Layout: cabeçalho com abas; Painel (resumo e retornos), Orçamentos (lista com status), Motoristas (diárias a pagar e pagas). Folha de formulário sobreposta. */
:root {
  --bg: #F6F3F5;
  --surface: #FFFFFF;
  --fg: #2B2629;
  --muted: #6B6267;
  --line: #E7DFE3;
  --accent: #D12A57; --brand: #DB315E; --brand2: #6E58A3; --brand-ink: #373435;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE6EC;
  --info: #2A5CA6; --info-bg: #E0EAF8;
  --warn: #8F5400; --warn-bg: #FBEBCB;
  --ok: #1B7447; --ok-bg: #DCF1E5;
  --bad: #AF342C; --bad-bg: #F8DEDB;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171316; --surface: #221C20; --fg: #F2ECEF; --muted: #A99DA4; --line: #382F35;
    --accent: #F0658B; --accent-ink: #2A0712; --accent-soft: #3A1A26;
    --info: #86B4F2; --info-bg: #172A45;
    --warn: #F0BB5A; --warn-bg: #3A2D10;
    --ok: #62D59D; --ok-bg: #153627;
    --bad: #F48D84; --bad-bg: #3E1D1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171316; --surface: #221C20; --fg: #F2ECEF; --muted: #A99DA4; --line: #382F35;
  --accent: #F0658B; --accent-ink: #2A0712; --accent-soft: #3A1A26;
  --info: #86B4F2; --info-bg: #172A45;
  --warn: #F0BB5A; --warn-bg: #3A2D10;
  --ok: #62D59D; --ok-bg: #153627;
  --bad: #F48D84; --bad-bg: #3E1D1B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 26px; line-height: 1.1; }
h2 { font-size: 18px; }
h3 { font-size: 16px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
header.top p { color: var(--muted); font-size: 13px; }
nav.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
nav.tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 7px; font-weight: 600; color: var(--muted); }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.bar .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; }

.btn.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
a.btn { text-decoration: none; display: inline-block; color: inherit; }
input[type=text], input[type=tel], input[type=number], input[type=date], input[type=month], input[type=search], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0;
}
.bar input, .bar select { width: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stat { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.stat .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.stat .value { font-family: var(--font-display); font-weight: 700; font-size: 24px; }
.stat .sub { font-size: 13px; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; padding-top: 0; }
.row .grow { min-width: 0; flex: 1 1 200px; }
.row .grow p { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.muted { color: var(--muted); }
.empty { color: var(--muted); padding: 6px 0; }

.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.s-enviado { background: var(--info-bg); color: var(--info); }
.s-negociando { background: var(--warn-bg); color: var(--warn); }
.s-aprovado, .pago { background: var(--ok-bg); color: var(--ok); }
.s-perdido { background: var(--bad-bg); color: var(--bad); }
.apagar { background: var(--warn-bg); color: var(--warn); }
select.statussel { width: auto; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; }
select.statussel.s-enviado { border-color: var(--info); }
select.statussel.s-negociando { border-color: var(--warn); }
select.statussel.s-aprovado { border-color: var(--ok); }
select.statussel.s-perdido { border-color: var(--bad); }

.q { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.q:first-child { border-top: 0; }
.q .main { min-width: 0; }
.q .main p { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.q .side { text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.q .side strong { font-family: var(--font-display); font-size: 18px; }
.q .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }

.drivers { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.driver { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.driver .figs { display: flex; gap: 18px; flex-wrap: wrap; }
.driver .figs div { display: flex; flex-direction: column; }
.driver .figs span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.driver .figs strong { font-family: var(--font-display); font-size: 19px; }
.driver .acts { display: flex; flex-wrap: wrap; gap: 6px; }

.banner { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; font-size: 14px; }
.grp { padding: 12px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.grp:first-child { border-top: 0; padding-top: 0; }
.line { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 13px; color: var(--muted); }
.line .d { min-width: 48px; }
.line .v { min-width: 150px; color: var(--fg); }
.notice { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 18px; color: var(--muted); }

.scrim { position: fixed; inset: 0; background: rgba(8, 20, 22, 0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.scrim[hidden] { display: none !important; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 16px; } }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field.check { flex-direction: row; align-items: center; gap: 8px; }
.field.check input { width: auto; }
.field.check label { color: var(--fg); }
@media (max-width: 480px) { .fields { grid-template-columns: 1fr; } }
.sheet .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
.sheet .actions .right { display: flex; gap: 8px; margin-left: auto; }
.field.sect { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
.field.sect h3 { font-size: 15px; }
.field.sect p { color: var(--muted); font-size: 13px; }
.field.mapsrow { grid-column: 1 / -1; display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.field.mapsrow .hint { color: var(--muted); font-size: 13px; flex: 1 1 200px; min-width: 0; }
.calc { grid-column: 1 / -1; background: var(--accent-soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.calc .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px 14px; }
.calc .figs div { display: flex; flex-direction: column; min-width: 0; }
.calc .figs span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.calc .figs strong { font-family: var(--font-display); font-size: 18px; overflow-wrap: anywhere; }
.calc .note { font-size: 13px; color: var(--muted); }
.calc .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

details.fs summary span::before { content: "\25B8  "; }
details.fs[open] summary span::before { content: "\25BE  "; }
details.fs summary small { color: var(--muted); font-weight: 400; font-size: 13px; }
details.fs[open] summary { padding-bottom: 8px; }
.sheet .actions { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: 4px; margin-top: 2px; z-index: 2; }
input.cin { width: 150px; padding: 4px 8px; font-size: 13px; }
.line { align-items: center; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); }

.note-tel { font-size: 12px; font-weight: 600; color: var(--warn); background: var(--warn-bg); border-radius: 999px; padding: 2px 10px; align-self: flex-start; }

/* ---- Identidade Rota Transportes ---- */
body { background: var(--bg); background-image: radial-gradient(900px 260px at 100% -40px, color-mix(in srgb, var(--brand) 12%, transparent), transparent 70%); }
header.top { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 14px; align-items: center; box-shadow: 0 6px 24px -14px rgba(110, 88, 163, .45); position: relative; overflow: hidden; }
header.top::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--brand), var(--brand2)); }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand .logo { background: #fff; border-radius: 12px; padding: 6px 10px; display: flex; border: 1px solid #efe6ea; }
.brand .logo img { display: block; height: 40px; width: auto; }
.brand h1 { font-size: 20px; }
.brand p { margin-top: 2px; }
nav.tabs { border-radius: 999px; padding: 4px; background: var(--bg); }
nav.tabs button { border-radius: 999px; transition: background .15s, color .15s; }
nav.tabs button:hover:not([aria-selected="true"]) { color: var(--fg); background: var(--accent-soft); }
nav.tabs button[aria-selected="true"] { background: linear-gradient(135deg, var(--brand), #C4245A); color: #fff; box-shadow: 0 4px 12px -4px rgba(219, 49, 94, .6); }
.btn { border-radius: 999px; transition: transform .1s, box-shadow .15s, border-color .15s; }
.btn:hover { box-shadow: 0 4px 12px -6px rgba(110, 88, 163, .5); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, var(--brand), #C4245A); border-color: transparent; color: #fff; }
.btn.armed { background: var(--bad); }
.panel, .driver, .stats, .notice, .calc, details.fs { border-radius: 16px; }
.panel, .driver, .stats { box-shadow: 0 8px 24px -18px rgba(55, 52, 53, .5); }
.stat .value { color: var(--brand-ink); }
:root[data-theme="dark"] .stat .value { color: var(--fg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stat .value { color: var(--fg); } }
.stat { position: relative; }
.stat::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: linear-gradient(var(--brand), var(--brand2)); }
.chip { transition: all .15s; }
.optchips { margin-bottom: 2px; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
input[type=text], input[type=tel], input[type=number], input[type=date], input[type=month], input[type=search], select, textarea { border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
.sheet { border-radius: 22px 22px 0 0; border-top: 4px solid var(--brand); }
@media (min-width: 640px) { .sheet { border-radius: 22px; } }
.q .side strong { color: var(--brand); }
.calc { background: var(--accent-soft); border-color: color-mix(in srgb, var(--brand) 25%, var(--line)); }
.s-enviado { background: #ECE7F6; color: #5A458F; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .s-enviado { background: #2B2440; color: #BDAEE6; } }
:root[data-theme="dark"] .s-enviado { background: #2B2440; color: #BDAEE6; }
select.statussel.s-enviado { border-color: var(--brand2); }
@media (max-width: 560px) { header.top { padding: 12px; } .brand .logo img { height: 34px; } nav.tabs { width: 100%; overflow-x: auto; scrollbar-width: none; } nav.tabs button { flex: 0 0 auto; padding: 8px 13px; font-size: 13px; } }
.drop{position:relative;border:2px dashed var(--line,#c9ced6);border-radius:12px;padding:18px 12px;text-align:center;background:rgba(127,127,127,.06);transition:.15s}
.drop.over{border-color:#e30613;background:rgba(227,6,19,.08)}
.drop-t{font-weight:600}.drop-s{font-size:12px;opacity:.7;margin-top:2px}
.drop input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.hbars{display:flex;flex-direction:column;gap:8px}.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;font-size:13px}.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb-t{background:rgba(127,127,127,.15);border-radius:6px;height:14px;overflow:hidden}.hb-t i{display:block;height:100%;background:#e30613;border-radius:6px}.hb-v{min-width:52px;text-align:right}
.vrow{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:10px}.vrow select{flex:1 1 170px}.vrow label{display:flex;flex-direction:column;font-size:11px;gap:2px;flex:1 1 90px}.vrow input{width:100%}.vrow .v-tot{min-width:96px;text-align:right;align-self:center}
.qnum{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:2px}
.urg{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap;background:rgba(127,127,127,.15)}
.urg-regular{background:#e1f2e9;color:#1f7a4d}.urg-critico{background:#fff1c9;color:#8a5a00}.urg-urgente{background:#fde2e4;color:#b4232f}.urg-ok{background:#e3e9f8;color:#1b3a8c}
.ac{border-left:6px solid rgba(127,127,127,.4)}.ac-regular{border-left-color:#1f9d57}.ac-critico{border-left-color:#e6a100}.ac-urgente{border-left-color:#d62839}.ac-ok{border-left-color:#1b3a8c}
.marcos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}.marcos li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px dashed rgba(127,127,127,.3)}.marcos li.feito span:first-child{opacity:.6;text-decoration:line-through}
.mk{white-space:nowrap}.mk.ok{color:#1f7a4d}.mk.atr{color:#b4232f;font-weight:700}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:middle;background:#9aa0a6;box-shadow:0 0 0 2px rgba(127,127,127,.25);transition:background .4s}
.d-regular{background:#1f9d57}.d-critico{background:#f2b300}.d-urgente{background:#d62839;animation:dotp 1.2s infinite}.d-ok{background:#1b3a8c}.d-off{background:#9aa0a6}
@keyframes dotp{0%{box-shadow:0 0 0 0 rgba(214,40,57,.7)}70%{box-shadow:0 0 0 8px rgba(214,40,57,0)}100%{box-shadow:0 0 0 0 rgba(214,40,57,0)}}
@media (prefers-reduced-motion:reduce){.d-urgente{animation:none}}
.urgbox{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;padding:6px 10px 6px;border-radius:8px;font-size:11px;text-align:right;color:#fff}
.urgbox b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}.urgbox span{font-weight:600;opacity:.95}
.ub-regular{background:#1f9d57}.ub-critico{background:#f2b300;color:#2b2000}.ub-urgente{background:#d62839;animation:ubp 1.4s infinite}
@keyframes ubp{0%,100%{box-shadow:0 0 0 0 rgba(214,40,57,.6)}50%{box-shadow:0 0 0 6px rgba(214,40,57,0)}}
@media (prefers-reduced-motion:reduce){.ub-urgente{animation:none}}
.q{border-left:5px solid transparent;padding-left:12px}.q-regular{border-left-color:#1f9d57}.q-critico{border-left-color:#f2b300}.q-urgente{border-left-color:#d62839;background:rgba(214,40,57,.05)}.q-ok{border-left-color:#1b3a8c}
.q .rota{font-weight:600;color:var(--text,inherit);font-size:14px;margin:2px 0}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}.tg{font-size:12px;padding:2px 8px;border-radius:6px;background:rgba(127,127,127,.14)}
.tg-data{font-weight:700;color:#fff}.tg-regular{background:#1f9d57}.tg-critico{background:#f2b300;color:#2b2000}.tg-urgente{background:#d62839}
.q .env{font-size:12px!important}.det{font-size:12px;color:var(--muted)}.det summary{cursor:pointer;display:inline-block;padding:2px 0}.det p{margin:2px 0}
.more{position:relative;display:inline-block}.more>summary{list-style:none;cursor:pointer}.more>summary::-webkit-details-marker{display:none}
.morebox{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.vquick{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:6px 0 10px;padding:10px;border-radius:10px;background:rgba(127,127,127,.1)}.vquick label{font-weight:600}.vquick input{width:80px}
.ctog{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:rgba(127,127,127,.1);border:0;border-radius:8px;padding:8px 10px;margin:8px 0 4px;font:inherit;font-weight:600;cursor:pointer;color:inherit}.ctog .arw{display:inline-block;width:22px;font-size:20px;line-height:1;color:var(--brand,#d62839)}.ctog{padding:6px 10px;border:1px solid rgba(127,127,127,.25);width:auto}.ctog .muted{font-weight:400;font-size:12px}
.ferbox{display:flex;flex-direction:column;gap:6px;background:#fff3bf;border:2px solid #f2b300;color:#5c4200;border-radius:10px;padding:10px 12px;font-size:13px}.ferbox[hidden]{display:none}
.ferit{display:flex;gap:10px;align-items:flex-start}.ferex{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#f2b300;color:#2b2000;font-style:normal;font-weight:800;font-size:15px;line-height:1}
.ferbanner{background:#fff3bf!important;border:2px solid #f2b300;color:#5c4200!important}.ferbanner .ferex{vertical-align:middle;margin-right:4px}

  function fmtShort(s) { return s ? s.slice(8, 10) + '/' + s.slice(5, 7) : ''; }
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  function errMsg(e) {

  function copy(text) {
    function fallback() {
      var t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';

      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t);
      toast(ok ? 'Texto copiado.' : 'Não consegui copiar. Tente de novo.');
    }
    try { navigator.clipboard.writeText(text).then(function () { toast('Texto copiado.'); }, fallback); } catch (e) { fallback(); }
  }
  function waDeep(phone, text) {
    var d = String(phone || '').replace(/\D/g, ''); if (!d) return '';

  }
  function waLink(phone, text) {
    var d = String(phone || '').replace(/\D/g, '');

  }
  function legLinesOf(origem, legs) {

      if (to && prev && km > 0) out.push(prev + ' x ' + to + ' - ' + km + ' km');

    });
    return out;
  }
  function quoteLegLines(q) { return legLinesOf(q.origem, legsOf(q)); }
  function validadeMax(dv) { return dv ? addDays(dv, -1) : ''; }

  function qValidade(q) { return capValidade(q.validade || addDays(q.enviadoEm || today(), 20), q.dataViagem); }
  function qSinal(q) { return Math.round((Number(q.valor) || 0) * 40) / 100; }
  function qValidTxt(q) { var v = qValidade(q), d = daysBetween(q.enviadoEm || today(), v); return (d === 20 ? 'válido por 20 dias, até ' : 'válido até ') + fmtDate(v); }
  function quoteText(q) {
    var nome = (q.cliente || '').split(' ')[0];
    var lines = function (s) { return String(s || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean); };
    var per = q.dataViagem ? fmtDate(q.dataViagem) + (q.dataFim && q.dataFim !== q.dataViagem ? ' a ' + fmtDate(q.dataFim) : '') : '';
    var L = ['Olá' + (nome ? ', ' + nome : '') + '! Segue o *orçamento' + (qNumTxt(q) ? ' ' + qNumLabel(q) : '') + '* da *Rota Transportes*:'];
    if (q.origem && q.destino) L.push('*Trajeto:* ' + q.origem + ' → ' + q.destino + (q.paradas ? ' (paradas: ' + q.paradas + ')' : '') + (q.idaVolta ? ', ida e volta' : ''));
    else if (q.destino) L.push('*Passeio:* ' + q.destino);
    if (per || q.pessoas) L.push([per ? '*Período:* ' + per : '', q.pessoas ? '*Passageiros:* ' + q.pessoas : ''].filter(Boolean).join(' · '));

    L.push('*Valor total: ' + money(q.valor) + '*');

    return L.join('\n');
  }

  function extenso(v) {

    var D = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];

    }

      var parts = [], vals = [], mi = Math.floor(n / 1e6), mil = Math.floor((n % 1e6) / 1000), res = n % 1000;
      if (mi) { parts.push(ate999(mi) + (mi === 1 ? ' milhão' : ' milhões')); vals.push(mi * 1e6); }
      if (mil) { parts.push(mil === 1 ? 'mil' : ate999(mil) + ' mil'); vals.push(mil * 1000); }
      if (res) { parts.push(ate999(res)); vals.push(res); }

  function fmtNum(v) { return (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fillRecibo(body, it) {
    var v = Number(it.valor) || 0, vInt = String(Math.round(v)), vBr = fmtNum(v), ext = String(extenso(v)).replace(/\s+reais?$/i, '');
    var n14 = 0;
    function must(from, to) { if (body.indexOf(from) < 0) throw new Error('Modelo de recibo mudou: ' + from.slice(0, 30)); body = body.split(from).join(to); }
    body = body.replace(/<w:t>14<\/w:t>/g, function () { n14++; return '<w:t>' + (n14 === 2 ? vInt : '') + '</w:t>'; });
    must('<w:t>0,00</w:t>', '<w:t>' + vBr + '</w:t>');
    must('<w:t>0 (</w:t>', '<w:t xml:space="preserve"> (</w:t>');
    must('<w:t>cento e quarenta</w:t>', '<w:t>' + esc(ext) + '</w:t>');
    must('Eu, _________________________________ (Motoristas), inscrito com a matrícula Nº_________ declaramos',
      'Eu, ' + (esc(it.nome) || '_________________________________') + ' (Motoristas), inscrito com a matrícula Nº' + (it.matricula ? ' ' + esc(it.matricula) : '_________') + ' declaramos');
    must('Contrato: 218', 'Contrato: ' + (esc(it.contrato) || '__________'));
    var dt = String(it.data || today()).split('-');
    must('______________________, ____ de __________________ de ______.', 'Salvador, ' + Number(dt[2]) + ' de ' + MESES[Number(dt[1]) - 1] + ' de ' + dt[0] + '.');
    return body;
  }
  async function buildReciboDocx(items) {
    var zip = await JSZip.loadAsync(RECIBO_TPL, { base64: true });
    var doc = await zip.file('word/document.xml').async('string');
    var a = doc.indexOf('<w:body>') + 8, z = doc.lastIndexOf('<w:sectPr');
    var body = doc.slice(a, z);

  /* ---------- recibos (assinatura de recebimento) ---------- */
  function reciboList() { return S.diarias.filter(function (d) { return d.pago && d.pagoEm && d.pagoEm.slice(0, 7) === UI.month; }); }
  function nDias(v) { return Math.round((Number(v) || 0) / DIARIA); }
  function reciboGroups(list) {
    var by = {};
    list.forEach(function (d) { (by[d.motoristaId] = by[d.motoristaId] || []).push(d); });
    return Object.keys(by).map(function (id) {
      var arr = by[id].sort(function (a, b) { return a.pagoEm.localeCompare(b.pagoEm); });
      var signed = arr.filter(function (x) { return x.assinado; }).length;
      return { id: id, nome: driverName(id), arr: arr, signed: signed, st: signed === arr.length ? 'assinado' : (signed === 0 ? 'a-assinar' : 'parcial'),
        total: sum(arr, function (x) { return x.valor; }), dias: sum(arr, function (x) { return nDias(x.valor); }) };
    }).sort(function (a, b) { return a.nome.localeCompare(b.nome); });
  }
  function visibleGroups(list) {
    var term = UI.sSearch.trim().toLowerCase();
    return reciboGroups(list).filter(function (g) {
      if (UI.sFilter === 'a-assinar' && g.st === 'assinado') return false;
      if (UI.sFilter === 'assinados' && g.st !== 'assinado') return false;
      return !term || g.nome.toLowerCase().indexOf(term) >= 0;
    });
  }
  function signPill(g) {
    if (g.st === 'assinado') return '<span class="pill pago">Assinado</span>';
    if (g.st === 'parcial') return '<span class="pill s-enviado">Parcial ' + g.signed + ' de ' + g.arr.length + '</span>';
    return '<span class="pill apagar">A assinar</span>';
  }
  function fechamentoOf(m) { return S.fechamentos.filter(function (x) { return x.id === m; })[0] || null; }
  function pendingText() {
    var g = reciboGroups(reciboList()).filter(function (x) { return x.st !== 'assinado'; });
    if (!g.length) return '';
    return 'Recibos a assinar, ' + monthLabel(UI.month) + ':\n' + g.map(function (x) {
      var p = x.arr.filter(function (y) { return !y.assinado; });
      return '- ' + x.nome + ': ' + p.length + ' pagamento(s), ' + money(sum(p, function (y) { return y.valor; }));
    }).join('\n');
  }
  async function closeMonth() {

    if (id === 'm1') Object.assign(o, { origem: q.origem || '', destino: q.destino || '', periodo: per + (q.idaVolta && per ? ' (ida e volta)' : ''), trechos: q.paradas ? 'Paradas: ' + q.paradas : '', veiculos: vtxt, conforto: conf, total: v, lista: true });
    if (id === 'm2') Object.assign(o, { destino: q.destino || '', saida: [per, q.origem ? 'saindo de ' + q.origem : ''].filter(Boolean).join(', '), veiculo: vtxt, pax: pax, conforto: conf, total: v, lista: true, longa: false });
    if (id === 'm3') Object.assign(o, { dia: per, roteiro: trajeto, qtd: String(qtd), veiculo: vv[0] ? vv[0].nome : '', unit: v ? String(Math.round(Number(q.valor) / qtd * 100) / 100) : '', lista: false });

  }
  function fieldHtml(f, v) {

  }
  function build() {
    ov = document.createElement('div'); ov.className = 'pp-ov'; ov.hidden = true;
    ov.innerHTML = '<div class="pp-box" role="dialog" aria-modal="true" aria-label="Gerar proposta"><div class="pp-head"><h2 id="pp-title">Proposta comercial</h2><button type="button" class="btn small" data-pp="close">Fechar</button></div>' +

      '<div class="pp-grid" id="pp-grid" data-view="form"><div class="pp-form" id="pp-form"></div><div class="pp-prev" id="pp-prev"></div></div>' +
      '<div class="pp-hint" id="pp-hint"></div>' +
      '<div class="pp-bar"><button type="button" class="btn primary" data-pp="share">Enviar PDF no WhatsApp</button><button type="button" class="btn" data-pp="pdf">Baixar PDF</button><a class="btn" id="pp-wa" target="_blank" rel="noopener" hidden>Abrir conversa com o texto</a><button type="button" class="btn" data-pp="copy">Copiar texto</button></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function (ev) {

      var t = ev.target.closest('[data-pp]'); if (!t) return; var a = t.dataset.pp;
      if (a === 'close') close();
      else if (a === 'model') { ST.model = t.dataset.m; persist(); renderAll(); }
      else if (a === 'view') { ST.view = t.dataset.v; syncView(); fit(); }
      else if (a === 'pdf') savePdf();
      else if (a === 'share') sharePdf();
      else if (a === 'copy') copyText(waText());
      else if (a === 'reset') { ST.vals[ST.model] = defaults(ST.model, ST.q); persist(); renderAll(); toast('Dados do orçamento restaurados.'); }
    });
    ov.addEventListener('input', onEdit); ov.addEventListener('change', onEdit);

    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ov && !ov.hidden) close(); });
  }
  function onEdit(ev) {
    var k = ev.target && ev.target.dataset && ev.target.dataset.ppk; if (!k) return;
    vals()[k] = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value; persist(); schedule();
  }
  var timer = null;
  function schedule() { clearTimeout(timer); timer = setTimeout(function () { renderPreview(); renderWa(); }, 120); }
  function syncView() {
    document.getElementById('pp-grid').dataset.view = ST.view;
    ov.querySelectorAll('[data-pp="view"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === ST.view)); });
  }
  function renderChips() {
    document.getElementById('pp-chips').innerHTML = MODELS.map(function (m) { return '<button type="button" class="chip" data-pp="model" data-m="' + m.id + '" aria-pressed="' + (m.id === ST.model) + '" title="' + esc(m.desc) + '">' + esc(m.name) + '</button>'; }).join('');
  }
  function renderForm() {
    var m = cur(), v = vals(), h = '<div><h3>Cliente</h3><div class="pp-fields">' +
      fieldHtml({ k: 'cliente', l: 'Cliente', type: 'text', full: 1 }, v) + fieldHtml({ k: 'contato', l: 'A/C (contato)', type: 'text' }, v) + fieldHtml({ k: 'nProposta', l: 'Nº da proposta', type: 'text' }, v) + fieldHtml({ k: 'data', l: 'Data', type: 'date', full: 1 }, v) + '</div></div>';
    m.sections.forEach(function (s) { h += '<div><h3>' + esc(s[0]) + '</h3><div class="pp-fields">' + s[1].map(function (f) { return fieldHtml(f, v); }).join('') + '</div></div>'; });
    h += '<details><summary class="muted" style="cursor:pointer;font-weight:600;font-size:13px">Assinatura</summary><div class="pp-fields" style="margin-top:8px">' +
      [['sigNome', 'Nome'], ['sigCargo', 'Cargo'], ['sigEmpresa', 'Empresa'], ['sigTel', 'Telefone'], ['sigEmail', 'E-mail']].map(function (x) { return fieldHtml({ k: x[0], l: x[1], type: 'text', full: 1 }, v); }).join('') + '</div></details>' +
      '<div><button type="button" class="btn small" data-pp="reset">Restaurar dados do orçamento</button></div>';

  }
  function renderPreview() {
    var f = vals(), pages = layout(cur().build(f)); lastPages = pages; blobCache = null;
    var host = document.getElementById('pp-prev'); host.innerHTML = '';
    pages.forEach(function (cmds, i) {
      var w = document.createElement('div'); w.className = 'pp-pg';
      var sh = document.createElement('div'); sh.className = 'pp-sheet';
      var paper = document.createElement('div'); paper.className = 'pp-paper'; paper.style.backgroundImage = 'url(' + BG + ')';
      cmds.forEach(function (c) {
        var e;
        if (c.k === 't') {

          e.style.fontSize = px + 'px'; e.style.fontWeight = c.b ? '700' : '400'; e.style.color = c.c; e.style.top = (c.y * PX - 0.75 * px) + 'px';
          if (c.al === 'r') e.style.right = (793.7 - c.x * PX) + 'px'; else e.style.left = (c.x * PX) + 'px';
        } else if (c.k === 'r') {
          e = document.createElement('div'); e.className = 'pp-l'; var bw = c.s ? Math.max(1, c.sw * PX) : 0;
          e.style.left = (c.x * PX) + 'px'; e.style.top = (c.y * PX) + 'px'; e.style.width = (c.w * PX) + 'px'; e.style.height = (c.h * PX) + 'px'; e.style.boxSizing = 'border-box';

  }

  }
  function firstName() { var n = (vals().contato || ST.q.cliente || '').trim().split(/\s+/)[0]; return n || ''; }
  function waText() {

    cur().build(f).forEach(function (b) {

  function waHref(text) {

  }

  /* ---------- PDF ---------- */
  function rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function makeDoc() {
    if (!window.jspdf) return null;
    var doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true });
    doc.addFileToVFS('Carlito-Regular.ttf', FONT_R); doc.addFont('Carlito-Regular.ttf', 'Carlito', 'normal');
    doc.addFileToVFS('Carlito-Bold.ttf', FONT_B); doc.addFont('Carlito-Bold.ttf', 'Carlito', 'bold');
    lastPages.forEach(function (cmds, i) {
      if (i) doc.addPage();

        } else { var lc = rgb(c.c); doc.setDrawColor(lc[0], lc[1], lc[2]); doc.setLineWidth(c.w); doc.line(c.x1, c.y1, c.x2, c.y2); }

  function fileName() { var f = vals(); return ('Proposta ROTA - ' + (f.cliente || 'cliente')).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim() + '.pdf'; }
  async function savePdf() {

  }
  function sent(via) { try { if (ST.opts && ST.opts.onSent) ST.opts.onSent(via); } catch (e) {} }
  async function sharePdf() {
    var doc = makeDoc(); if (!doc) { toast('Não consegui carregar o gerador de PDF. Verifique a conexão.'); return; }
    var file = null;
    try { file = new File([doc.output('blob')], fileName(), { type: 'application/pdf' }); } catch (e) {}

    }

    if (ok) { toast('PDF salvo. Abra a conversa e anexe o arquivo (clipe, Documento).'); sent('PDF baixado'); }
  }
  function copyText(text) {
    function fb() { var t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} document.body.removeChild(t); toast(ok ? 'Texto copiado.' : 'Não consegui copiar.'); }
    try { navigator.clipboard.writeText(text).then(function () { toast('Texto copiado.'); }, fb); } catch (e) { fb(); }
  }

  function open(q, opts) {

})();
